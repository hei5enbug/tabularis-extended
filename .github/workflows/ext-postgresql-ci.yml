name: postgresql-plus CI

on:
  push:
    branches: [main]
    paths:
      - "extensions/postgresql/**"
      - ".github/workflows/ext-postgresql-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/postgresql/**"
      - ".github/workflows/ext-postgresql-ci.yml"
    # Default types are opened/synchronize/reopened, which miss title-only
    # edits — needed so pr-title re-checks a title edit. labeled/unlabeled
    # removed: those were only ever needed by version-suggestion, which now
    # lives in its own workflow (version-suggestion.yml) with its own types.
    types: [opened, edited, reopened, synchronize]
  schedule:
    # Weekly cargo-audit sweep to catch newly-disclosed CVEs in deps that
    # haven't otherwise changed. Off-peak minute, not :00/:30.
    - cron: "17 6 * * 1"

defaults:
  run:
    working-directory: extensions/postgresql

jobs:
  test:
    name: postgresql-plus / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Run tests
        # --lib --bins excludes tests/live_db.rs: that's a live-database
        # integration test requiring a running PostgreSQL instance, covered
        # by the dedicated live-db-integration job below.
        run: cargo test --lib --bins

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  validate-manifest:
    name: postgresql-plus / Validate .tabularium manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate against the live registry schema
        run: npx --yes @tabularium/cli validate .tabularium --registry https://registry.tabularis.dev --kind driver

  pr-title:
    name: postgresql-plus / PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    name: postgresql-plus / Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run markdownlint
        run: npx --yes markdownlint-cli "**/*.md"

  audit:
    name: postgresql-plus / Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      # rustsec/audit-check only files a tracking issue for informational
      # warnings (e.g. "unmaintained") on cron-scheduled runs, not push/PR
      # runs — which is why this permission gap went unnoticed until the
      # first scheduled run hit an unmaintained-crate warning.
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2
        with:
          working-directory: extensions/postgresql
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0235: vulnerable rkyv 0.7.46, pulled in transitively
          # by rust_decimal's own optional "rkyv" feature declaration in its
          # Cargo.toml — we never enable that feature (only "db-tokio-postgres"
          # and "serde"), and confirmed no rkyv symbols are linked into the
          # release binary (`nm -D target/release/postgresql-plugin | grep
          # rkyv` — no output). cargo-audit scans the full Cargo.lock graph
          # regardless of which optional features are active, so this is a
          # lockfile-only entry with no reachable code path in what we ship.
          # Re-check this ignore whenever rust_decimal is upgraded, in case a
          # newer release changes what's declared as optional.
          ignore: RUSTSEC-2026-0235

  live-db-integration:
    name: postgresql-plus / Live PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 54320:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The spatial_live service tests connect as postgres without a password,
      # so they get their own server; live_db keeps checking password errors.
      postgres-trust:
        image: postgres:16
        ports:
          - 54321:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Run live-database integration test
        env:
          POSTGRES_PLUGIN_BIN: ${{ github.workspace }}/extensions/postgresql/target/debug/postgresql-plugin
          PGHOST: 127.0.0.1
          PGPORT: 54320
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: testdb
        run: cargo test --test live_db -- --test-threads=1

      # The PostGIS-free service tests of the spatial_live target, including the
      # catalog_describe test of every object kind. The rest of the target needs
      # PostGIS and runs outside CI.
      - name: Run PostGIS-free service live tests
        env:
          TABULARIS_P1B_POSTGIS_PORT: 54321
        run: cargo test --test spatial_live postgis없는_db -- --test-threads=1
