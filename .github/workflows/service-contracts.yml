name: Service contract bootstrap

on:
  pull_request:
    paths:
      - packages/service-contracts/**
      - src-tauri/src/services/**
      - .github/workflows/service-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/tabularis-x0-target/host-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - name: Install contract dependencies
        run: pnpm --filter @tabularis/service-contracts install --frozen-lockfile --ignore-scripts
      - name: Typecheck shared contracts
        run: pnpm --filter @tabularis/service-contracts typecheck
      - name: Check Rust DTOs and shared schema fixtures
        run: cargo test --locked --manifest-path packages/service-contracts/rust/Cargo.toml
      - name: Check Ajv and Rust fixture agreement
        run: pnpm --filter @tabularis/service-contracts test
