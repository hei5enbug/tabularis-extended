name: Extended verified artifacts

on:
  workflow_dispatch:
    inputs:
      companion_ref:
        description: Exact 40-character SQL Server Plus commit matching integration/companions.json
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  checks:
    if: github.repository == 'hei5enbug/tabularis-extended'
    uses: ./.github/workflows/ci.yml

  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build verified SQL Server Plus source
        id: companion
        uses: ./.github/actions/build-companion
        with:
          ref: ${{ inputs.companion_ref }}
          profile: debug
          platform: linux-x64
      - name: Build pinned PostgreSQL driver
        shell: bash
        run: |
          pg_root="$RUNNER_TEMP/postgresql-pinned"
          pg_commit=$(node -p 'JSON.parse(require("fs").readFileSync("integration/companions.json")).postgresql.commit')
          git init "$pg_root"
          git -C "$pg_root" remote add origin https://github.com/TabularisDB/tabularis-postgresql-plugin.git
          git -C "$pg_root" fetch --depth 1 origin "$pg_commit"
          git -C "$pg_root" checkout --detach FETCH_HEAD
          test "$(git -C "$pg_root" rev-parse HEAD)" = "$pg_commit"
          cargo build --locked --manifest-path "$pg_root/Cargo.toml" --bin postgresql-plugin
          echo "TABULARIS_TEST_POSTGRES_SOURCE_DIR=$pg_root" >> "$GITHUB_ENV"
      - name: Build host MCP executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin tabularis-extended
      - name: Run owned database integration tests
        env:
          TABULARIS_TEST_HOST_BINARY: ${{ github.workspace }}/src-tauri/target/debug/tabularis-extended
          TABULARIS_TEST_SQL_PACKAGE_DIR: ${{ steps.companion.outputs.package_dir }}
        run: |
          npm --prefix tests/containers ci --ignore-scripts --no-audit --no-fund
          pnpm test:containers

  artifacts:
    needs: integration
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            bundle: dmg
          - runner: ubuntu-24.04
            platform: linux-x64
            bundle: deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build verified SQL Server Plus source
        id: companion
        uses: ./.github/actions/build-companion
        with:
          ref: ${{ inputs.companion_ref }}
          profile: release
          platform: ${{ matrix.platform }}
      - name: Bind the companion package to the host build
        env:
          COMPANION_ROOT: ${{ steps.companion.outputs.source_dir }}
          COMPANION_ARCHIVE: ${{ steps.companion.outputs.archive }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/pin-companion.mjs --source-root "$COMPANION_ROOT" --archive "$COMPANION_ARCHIVE" --platform "$PLATFORM" --lock "$GITHUB_WORKSPACE/integration/companions.json"
      - name: Build unsigned native installer
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: pnpm tauri build --no-sign --ci --bundles "$BUNDLE" -- --locked
      - name: Stage artifacts and provenance
        env:
          COMPANION_ARCHIVE: ${{ steps.companion.outputs.archive }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/stage-extended-release.mjs --root "$GITHUB_WORKSPACE" --bundle-root "$GITHUB_WORKSPACE/src-tauri/target/release/bundle" --output "$RUNNER_TEMP/extended-release" --companion-archive "$COMPANION_ARCHIVE" --platform "$PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tabularis-extended-${{ matrix.platform }}
          path: ${{ runner.temp }}/extended-release/*
          if-no-files-found: error
          retention-days: 14
