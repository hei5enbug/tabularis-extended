name: Extended checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: extended-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    if: github.repository == 'hei5enbug/tabularis-extended'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/TabularisDB/tabularis.git 2>/dev/null || true
          git fetch --no-tags upstream 'refs/tags/v*:refs/tags/v*' \
            || echo "::warning::Could not fetch every upstream tag. The identity check uses the tags it finds."

      - name: Check fork identity
        run: node scripts/check-fork-identity.mjs
