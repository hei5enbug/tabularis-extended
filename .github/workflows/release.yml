name: Release

on:
  push:
    tags:
      - "plus-v*"

jobs:
  validate:
    name: Validate fork release
    runs-on: ubuntu-latest
    steps:
      - name: Require the fork repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REPOSITORY" != "hei5enbug/tabularis-sqlserver-plus" ]; then
            echo "::error::Release is permitted only from hei5enbug/tabularis-sqlserver-plus."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: explain/package.json

      - name: Check tag and exact package versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          case "$TAG_NAME" in
            plus-v*) TAG_VERSION="${TAG_NAME#plus-v}" ;;
            *) echo "::error::Expected a plus-v<version> tag."; exit 1 ;;
          esac
          node scripts/preflight.mjs --root . --metadata-only --expected-version "$TAG_VERSION"

      - name: Build debug plugin
        run: cargo build --locked --bin sqlserver-plugin

      - name: Run Rust unit and conformance tests
        run: cargo test --locked --bins --test conformance

      - name: Run Rust lint and formatting checks
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Install UI dependencies
        working-directory: ui
        run: npx --yes npm@11.6.2 ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck UI
        working-directory: ui
        run: npm run typecheck

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI bundle
        working-directory: ui
        run: npm run build

      - name: Install EXPLAIN dependencies
        working-directory: explain
        run: pnpm install --frozen-lockfile

      - name: Typecheck EXPLAIN parser
        working-directory: explain
        run: pnpm typecheck

      - name: Test EXPLAIN parser
        working-directory: explain
        run: pnpm test

      - name: Build EXPLAIN bundle
        working-directory: explain
        run: pnpm build

      - name: Run manifest preflight and packaging tests
        run: |
          node scripts/preflight.mjs --root . --asset-root .
          node --test tests/packaging/*.test.mjs

      - name: Install Testcontainers dependencies
        run: npm --prefix tests/containers ci --ignore-scripts --no-audit --no-fund

      - name: Run owned SQL Server Testcontainers suite
        run: npm --prefix tests/containers test

  build:
    name: ${{ matrix.platform-label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-suffix: ""
            cross: false
          - platform-label: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary-suffix: ""
            cross: true
          - platform-label: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary-suffix: ""
            cross: false
          - platform-label: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary-suffix: ""
            cross: false
          - platform-label: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary-suffix: ".exe"
            cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: explain/package.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npx --yes npm@11.6.2 ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Build EXPLAIN bundle
        working-directory: explain
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install cross (linux-arm64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binary (cross)
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} --bin sqlserver-plugin

      - name: Build release binary
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} --bin sqlserver-plugin

      - name: Create deterministic package and SHA-256 sidecar
        shell: bash
        run: |
          node scripts/package.mjs \
            --root . \
            --binary "target/${{ matrix.target }}/release/sqlserver-plugin${{ matrix.binary-suffix }}" \
            --platform "${{ matrix.platform-label }}" \
            --output "sqlserver-plus-${{ matrix.platform-label }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: sqlserver-plus-${{ matrix.platform-label }}
          path: |
            sqlserver-plus-${{ matrix.platform-label }}.zip
            sqlserver-plus-${{ matrix.platform-label }}.zip.sha256
          retention-days: 1

  release:
    name: Publish unsigned GitHub release assets
    needs: build
    if: github.repository == 'hei5enbug/tabularis-sqlserver-plus'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Detect prerelease from tag
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#plus-v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            .tabularium
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
