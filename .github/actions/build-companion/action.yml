name: Build pinned SQL Server Plus
description: Verify all source bytes before building the companion package
inputs:
  ref:
    required: true
    description: Exact companion source commit
  profile:
    required: true
    description: debug or release
  platform:
    required: true
    description: Companion package platform
outputs:
  source_dir:
    value: ${{ steps.build.outputs.source_dir }}
    description: Verified companion worktree
  archive:
    value: ${{ steps.build.outputs.archive }}
    description: Packaged companion archive
  package_dir:
    value: ${{ steps.build.outputs.package_dir }}
    description: Temporary verified plugin installation
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        COMPANION_REF: ${{ inputs.ref }}
        BUILD_PROFILE: ${{ inputs.profile }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        [[ "$COMPANION_REF" =~ ^[0-9a-f]{40}$ ]]
        [[ "$BUILD_PROFILE" == debug || "$BUILD_PROFILE" == release ]]
        companion_root="$RUNNER_TEMP/sqlserver-plus-source"
        artifact_root="$RUNNER_TEMP/sqlserver-plus-artifacts"
        git init "$companion_root"
        git -C "$companion_root" remote add origin https://github.com/hei5enbug/tabularis-sqlserver-plus.git
        git -C "$companion_root" fetch --depth 1 origin "$COMPANION_REF"
        git -C "$companion_root" -c core.autocrlf=false checkout --detach FETCH_HEAD
        test "$(git -C "$companion_root" rev-parse HEAD)" = "$COMPANION_REF"
        expected=$(node -p 'JSON.parse(require("fs").readFileSync("integration/companions.json")).sqlserverPlus.sourceSha256')
        node scripts/companion-source.mjs verify --root "$companion_root" --expected "$expected"
        npx --yes npm@11.6.2 --prefix "$companion_root/ui" ci --ignore-scripts --no-audit --no-fund
        npm --prefix "$companion_root/ui" run typecheck
        npm --prefix "$companion_root/ui" test
        npm --prefix "$companion_root/ui" run build
        npx --yes pnpm@11.23.0 --dir "$companion_root/explain" install --frozen-lockfile
        npx --yes pnpm@11.23.0 --dir "$companion_root/explain" typecheck
        npx --yes pnpm@11.23.0 --dir "$companion_root/explain" test
        npx --yes pnpm@11.23.0 --dir "$companion_root/explain" build
        cargo test --locked --manifest-path "$companion_root/Cargo.toml" --bins --test conformance
        if [[ "$BUILD_PROFILE" == release ]]; then
          cargo build --locked --release --manifest-path "$companion_root/Cargo.toml" --bin sqlserver-plugin
        else
          cargo build --locked --manifest-path "$companion_root/Cargo.toml" --bin sqlserver-plugin
        fi
        node "$companion_root/scripts/preflight.mjs" --root "$companion_root" --asset-root "$companion_root"
        node --test "$companion_root"/tests/packaging/*.test.mjs
        mkdir "$artifact_root"
        archive="$artifact_root/sqlserver-plus-$PLATFORM.zip"
        node "$companion_root/scripts/package.mjs" --root "$companion_root" --binary "$companion_root/target/$BUILD_PROFILE/sqlserver-plugin" --platform "$PLATFORM" --output "$archive"
        mkdir "$artifact_root/profile"
        node "$companion_root/scripts/install.mjs" --archive "$archive" --sha256 "$archive.sha256" --profile-data-dir "$artifact_root/profile" --apply
        node scripts/companion-source.mjs verify --root "$companion_root" --expected "$expected"
        echo "source_dir=$companion_root" >> "$GITHUB_OUTPUT"
        echo "archive=$archive" >> "$GITHUB_OUTPUT"
        echo "package_dir=$artifact_root/profile/plugins/drivers/sqlserver-plus" >> "$GITHUB_OUTPUT"
