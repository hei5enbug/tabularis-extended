# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  - package-ecosystem: "cargo"
    directory: "/extensions/sqlserver-plus"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/extensions/sqlserver-plus/explain"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/extensions/postgresql"
    schedule:
      interval: "weekly"
