[package]
name = "tabularis-service-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../../../src-tauri/src/services/mod.rs"

[[bin]]
name = "validate-fixtures"
path = "src/validate_fixtures.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
jsonschema = { version = "0.18", default-features = false }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1"
sha2 = "0.10"
fs2 = "0.4"
base64 = "=0.22.1"
oauth2 = { version = "=5.0.0", default-features = false }
reqwest = { version = "0.13.1", features = ["json", "socks"] }
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tabularis-spatial-core = { path = "../../../extensions/spatial/crates/tabularis-spatial-core" }
